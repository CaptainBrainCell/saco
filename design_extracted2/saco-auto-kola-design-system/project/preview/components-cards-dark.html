<!doctype html>
<html lang="sk"><head><meta charset="utf-8"><title>Components — Cards on dark</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
body { margin: 0; padding: 24px; background: var(--bg-dark); display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.card.on-dark .ico { width: 32px; height: 32px; color: var(--accent); margin-bottom: 14px; }
.title { font-family: var(--font-heading); font-weight: 700; font-size: 20px; margin: 0 0 6px; color: var(--text-on-dark); }
.desc { font-family: var(--font-body); font-size: 15px; color: var(--text-on-dark-mut); margin: 0; }
</style></head>
<body>
<article class="card on-dark">
  <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l3 6 6 .9-4.5 4.3 1 6.3L12 16.7 6.5 19.5l1-6.3L3 8.9 9 8z"/></svg>
  <h3 class="title">20+ rokov skúseností</h3>
  <p class="desc">Učíme jazdiť od roku 2003.</p>
</article>
<article class="card on-dark">
  <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12l4-7h10l4 7-9 10z"/><path d="M12 8v8"/></svg>
  <h3 class="title">Detské ihrisko</h3>
  <p class="desc">Pre najmenších vodičov v Žiari.</p>
</article>
</body></html>
