<!doctype html>
<html lang="sk"><head><meta charset="utf-8"><title>Type — Display</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
body { margin: 0; padding: 28px; background: #fff; }
.h1 { font-family: var(--font-heading); font-weight: 800; font-size: 56px; line-height: 1.05; letter-spacing: -0.02em; color: var(--text); margin: 0; }
.h2 { font-family: var(--font-heading); font-weight: 700; font-size: 36px; line-height: 1.15; letter-spacing: -0.01em; color: var(--text); margin: 18px 0 0; }
.line { margin-top: 12px; }
.meta { font-family: var(--font-body); font-size: 11px; color: var(--text-muted); margin-top: 6px; font-feature-settings: "tnum"; }
</style></head>
<body>
<div class="h1">Naučíme vás jazdiť</div>
<hr class="road-line-h long line"/>
<div class="meta">h1 · Plus Jakarta Sans 800 · clamp(3rem, 7vw, 5.5rem) · -0.02em · 1.05</div>
<div class="h2">Otvárame nový kurz skupiny B</div>
<div class="meta">h2 · Plus Jakarta Sans 700 · clamp(2rem, 4vw, 3rem) · 1.15</div>
</body></html>
