<!doctype html>
<html lang="sk"><head><meta charset="utf-8"><title>Components — Nav</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
body { margin: 0; padding: 0; background: var(--bg-soft); }
.nav { background: #fff; border-bottom: 1px solid var(--border); padding: 14px 24px; display: flex; align-items: center; gap: 28px; }
.nav img { width: 110px; height: auto; }
.nav .links { display: flex; gap: 22px; margin-left: 24px; }
.nav .links a { font-family: var(--font-body); font-weight: 500; font-size: 14px; color: var(--text); }
.nav .right { margin-left: auto; display: flex; align-items: center; gap: 12px; }
.nav .new { font-family: var(--font-heading); font-size: 12px; font-weight: 700; color: var(--accent-hover); text-transform: uppercase; letter-spacing: 0.08em; }
.nav .btn { padding: 10px 18px; font-size: 13px; }
</style></head>
<body>
<nav class="nav">
  <img src="../assets/logo-dark.svg" alt="SACO">
  <div class="links">
    <a>Kurzy</a><a>Postup</a><a>Cenník</a><a>Ihrisko</a><a>Kontakt</a>
  </div>
  <div class="right">
    <a class="new">● Nový kurz</a>
    <button class="btn btn-primary">Prihlás sa</button>
  </div>
</nav>
</body></html>
