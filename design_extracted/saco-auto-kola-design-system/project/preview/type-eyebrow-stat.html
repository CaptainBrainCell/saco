<!doctype html>
<html lang="sk"><head><meta charset="utf-8"><title>Type — Eyebrow & Stats</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
body { margin: 0; padding: 28px; background: #fff; display: grid; grid-template-columns: 1fr 1fr; gap: 32px; align-items: start; }
.stat-num { font-family: var(--font-heading); font-weight: 700; font-size: 56px; line-height: 1; color: var(--text); font-feature-settings: "tnum" 1, "lnum" 1; letter-spacing: -0.02em; }
.stat-label { font-family: var(--font-body); font-size: 14px; color: var(--text-muted); margin-top: 8px; }
.meta { font-family: var(--font-body); font-size: 11px; color: var(--text-muted); margin-top: 10px; font-feature-settings: "tnum"; }
</style></head>
<body>
<div>
  <div class="eyebrow">Prečo my</div>
  <hr class="road-line-h short"/>
  <div class="meta">eyebrow · Plus Jakarta Sans 700 · 0.875rem · UPPER · tracking 0.12em · color --primary · road-line 40px below</div>
</div>
<div>
  <div class="stat-num">5 000+</div>
  <div class="stat-label">absolventov od roku 2003</div>
  <div class="meta">stat · Plus Jakarta Sans 700 · tabular nums · Slovak number formatting (5 000+, not 5,000+)</div>
</div>
</body></html>
