<!doctype html>
<html lang="sk"><head><meta charset="utf-8"><title>Colors — Surfaces</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
body { margin: 0; padding: 24px; background: #fafaf7; }
.grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
.sw { border-radius: 12px; overflow: hidden; border: 1px solid var(--border); }
.chip { height: 78px; display: flex; align-items: flex-end; padding: 10px; }
.meta { padding: 10px 12px; background: #fff; }
.name { font-family: var(--font-heading); font-weight: 700; font-size: 13px; color: var(--text); }
.hex { font-family: var(--font-body); font-size: 11px; color: var(--text-muted); font-feature-settings: "tnum"; margin-top: 2px; }
</style></head>
<body>
<div class="grid">
  <div class="sw"><div class="chip" style="background:#FFFFFF;border-bottom:1px solid var(--border)"></div><div class="meta"><div class="name">--bg</div><div class="hex">#FFFFFF</div></div></div>
  <div class="sw"><div class="chip" style="background:#F5F5F1"></div><div class="meta"><div class="name">--bg-soft</div><div class="hex">#F5F5F1</div></div></div>
  <div class="sw"><div class="chip" style="background:#0E1B2E"></div><div class="meta"><div class="name">--bg-dark</div><div class="hex">#0E1B2E</div></div></div>
  <div class="sw"><div class="chip" style="background:#14253D"></div><div class="meta"><div class="name">--bg-dark-2</div><div class="hex">#14253D</div></div></div>
</div>
</body></html>
