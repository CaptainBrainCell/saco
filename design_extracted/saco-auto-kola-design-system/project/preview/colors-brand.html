<!doctype html>
<html lang="sk"><head><meta charset="utf-8"><title>Colors — Brand</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
body { margin: 0; padding: 24px; background: #fafaf7; }
.grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
.sw { border-radius: 12px; overflow: hidden; border: 1px solid var(--border); }
.chip { height: 78px; }
.meta { padding: 10px 12px; background: #fff; }
.name { font-family: var(--font-heading); font-weight: 700; font-size: 13px; color: var(--text); }
.hex { font-family: var(--font-body); font-size: 11px; color: var(--text-muted); font-feature-settings: "tnum"; margin-top: 2px; }
</style></head>
<body>
<div class="grid">
  <div class="sw"><div class="chip" style="background:#2563EB"></div><div class="meta"><div class="name">--primary</div><div class="hex">#2563EB</div></div></div>
  <div class="sw"><div class="chip" style="background:#1D4ED8"></div><div class="meta"><div class="name">--primary-hover</div><div class="hex">#1D4ED8</div></div></div>
  <div class="sw"><div class="chip" style="background:#DBEAFE"></div><div class="meta"><div class="name">--primary-light</div><div class="hex">#DBEAFE</div></div></div>
  <div class="sw"><div class="chip" style="background:#F59E0B"></div><div class="meta"><div class="name">--accent</div><div class="hex">#F59E0B</div></div></div>
  <div class="sw"><div class="chip" style="background:#D97706"></div><div class="meta"><div class="name">--accent-hover</div><div class="hex">#D97706</div></div></div>
  <div class="sw"><div class="chip" style="background:#059669"></div><div class="meta"><div class="name">--success</div><div class="hex">#059669</div></div></div>
  <div class="sw"><div class="chip" style="background:#FEF3C7"></div><div class="meta"><div class="name">accent-tint</div><div class="hex">#FEF3C7</div></div></div>
  <div class="sw"><div class="chip" style="background:#D1FAE5"></div><div class="meta"><div class="name">success-tint</div><div class="hex">#D1FAE5</div></div></div>
</div>
</body></html>
